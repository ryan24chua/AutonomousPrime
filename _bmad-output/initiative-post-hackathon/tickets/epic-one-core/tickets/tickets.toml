# Stories of epic-one-core, in build order (ids are permanent; stories 12 and 13 were added 2026-11-11 and run first).
# Every story's check includes: golden master unchanged, except where a story names the numbers it moves (ADR-0004).

[[entry]]
id = 12
type = "story"
title = "Golden master pins outcomes, not prose"
description = "tests/golden/capture.py projects each captured run onto what the golden master now pins (AD-11 as amended 2026-11-11): per method and ablation the plan, cost, outcome, rule ids of violations and round count, and per console row the outcome and plan. Reason text, mediator log wording, the UI log and the decision-record markdown leave the snapshot. snapshot.json is regenerated once with no pinned value changing. design-register P1."
verify = "A scratch script shows every pinned value in the old snapshot equals the new one; pytest green; editing a reason string no longer fails tests/golden, editing a cost weight still does."
covers = ["R1"]
after = ["1.1"]
hitl = false
risk = "low"

[[entry]]
id = 13
type = "story"
title = "Locked dependencies"
description = "uv lock writes uv.lock with the exact version of every installed package; CI installs with uv sync --locked (dev extra) instead of resolving floor-only pins on every run; AGENTS.md 'Running and verifying' says how to upgrade on purpose (uv lock --upgrade). pip install -e . keeps working for anyone not using uv. design-register K1."
verify = "CI green installing from uv.lock; a fresh clone with uv sync --locked runs pytest green; pip install -e .[dev] still works."
covers = ["R1"]
after = [12]
hitl = false
risk = "low"

[[entry]]
id = 1
type = "story"
title = "One negotiate() for CLI, UI and cache script"
description = "Adds service.negotiate(flight_key, seed, live) -> RunResult (outcome, plan, rounds used, log path, decision record) and cli.py; middleman.py, mediator/run.py and make_cache.py call it, then middleman.py and mediator/run.py are deleted. live is an explicit argument defaulting to False; no entry point infers it from ANTHROPIC_API_KEY (design-register P7). RunResult is the versioned outcome object the UI and report read, instead of log step names (N8)."
verify = "python -m autonomousprime run reproduces the old mediator.run output; console smoke test passes; golden master unchanged."
covers = ["R1"]
after = ["1.4", 13]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "One cached data loader with hindsight removed"
description = "infra/data.py reads flights.csv once with the standard library csv module, caches parsed rows on disk as one file per date keyed by file hash and Python version (gitignored .cache/; no pyarrow or duckdb, decision 2026-11-10), keeps values as the exact csv strings, indexes by full date (year, month, day) with airport, by flight key and by tail, and returns rows without outcome columns; the data directory is a setting that defaults to the source checkout's data/ (design-register W6); data.outcomes() is the only path to them; world_stub.load_day, pilot_inputs.load_schedule, ground_agent _read_rows and the UI readers use it."
verify = "Timed dry run < 2 s (warm cache); test fails if any module outside evaluation/ imports data.outcomes; golden master unchanged."
covers = ["R2", "R3"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "One world with per-role views"
description = "core/world.py builds one frozen WorldState per run from the loader rows (background arrivals, filler, gates, crew, connections, alternate, fuel, provenance) and exposes atc/pilot/ground/fallback views; the four builders are deleted. Where the lanes disagree today (disrupted arrival and Ground's now, event type, year filter, 2400 handling, seeding) the world keeps one value, and each unification is its own commit that regenerates the golden master and states which numbers moved (design-register P2, W1; fixes RESULTS §5.4). The gate world works at every airport size and its random draws are keyed per flight, not one global seed (W3)."
verify = "Pure-move commits leave the golden master unchanged and each unification commit states its moved numbers; DFW-20150303-MQ3275 no longer ends in a false no valid plan; build_world succeeds for a Small hub and a Non-hub row; a test shows each role view excludes other roles' private fields; build_world is called once per negotiate()."
covers = ["R4"]
after = [2]
hitl = false
risk = "high"

