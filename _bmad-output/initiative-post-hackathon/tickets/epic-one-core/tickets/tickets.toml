# Stories of epic-one-core, in build order. Every story's check includes: golden master unchanged.

[[entry]]
id = 1
type = "story"
title = "One negotiate() for CLI, UI and cache script"
description = "Adds service.negotiate(flight_key, seed, live) -> RunResult (outcome, plan, rounds used, log path, decision record) and cli.py; middleman.py, mediator/run.py and make_cache.py call it, then middleman.py and mediator/run.py are deleted."
verify = "python -m autonomousprime run reproduces the old mediator.run output; console smoke test passes; golden master unchanged."
covers = ["R1"]
after = ["1.4"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "One cached data loader with hindsight removed"
description = "infra/data.py reads flights.csv once with the standard library csv module, caches parsed rows on disk as one file per date keyed by file hash and Python version (gitignored .cache/; no pyarrow or duckdb, decision 2026-11-10), keeps values as the exact csv strings, indexes by date/airport and tail, and returns rows without outcome columns; data.outcomes() is the only path to them; world_stub.load_day, pilot_inputs.load_schedule, ground_agent _read_rows and the UI readers use it."
verify = "Timed dry run < 2 s (warm cache); test fails if any module outside evaluation/ imports data.outcomes; golden master unchanged."
covers = ["R2", "R3"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "One world with per-role views"
description = "core/world.py builds one frozen WorldState per run from the loader rows (background arrivals, filler, gates, crew, connections, alternate, fuel, provenance) and exposes atc/pilot/ground/fallback views; the four builders are deleted. Lane-specific derived values that disagree today are kept as separate fields, named and labelled."
verify = "Golden master unchanged; a test shows each role view excludes other roles' private fields; build_world is called once per negotiate()."
covers = ["R4"]
after = [2]
hitl = false
risk = "high"

