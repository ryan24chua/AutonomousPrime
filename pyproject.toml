[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API and costs money; opt in with `pytest -m live`"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
